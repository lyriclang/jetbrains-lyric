name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Gradle caches the IntelliJ platform dependency, so the recurring cost is minutes, not the
    # first run's download.
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew buildPlugin verifyPluginStructure

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-lyric
          path: build/distributions/*.zip
          retention-days: 7

  verify:
    # The plugin verifier against both ends of the supported range. There are no unit tests here —
    # a headless IDE test costs more harness than this plugin has code — so this job is the
    # automated half of the checking, and the README's manual checklist is the other.
    #
    # It downloads an IDE per verified version, which is why it is a job of its own: minutes, and
    # a cache the build job has no use for.
    name: Verify against the supported IDEs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify plugin
        run: ./gradlew verifyPlugin

  grammar-sync:
    # The TextMate grammar's canonical home is the toolchain repository, where the test suite
    # pins it against the lexer — a grammar is a second description of the same language, and two
    # descriptions drift. This repository carries a working copy; this job is what keeps "copy"
    # from becoming "fork".
    name: Grammar matches the canonical copy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout the toolchain
        uses: actions/checkout@v7
        with:
          repository: lyriclang/lyric
          path: lyric
          sparse-checkout: tooling

      - name: Compare
        run: |
          diff -r textmate/syntaxes lyric/tooling/textmate/syntaxes
          diff textmate/language-configuration.json lyric/tooling/textmate/language-configuration.json

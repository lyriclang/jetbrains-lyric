name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Gradle caches the IntelliJ platform dependency, so the recurring cost is minutes, not the
    # first run's download.
    name: Build plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build plugin
        run: ./gradlew buildPlugin verifyPluginStructure

      - name: Upload plugin
        uses: actions/upload-artifact@v7
        with:
          name: jetbrains-lyric
          path: build/distributions/*.zip
          retention-days: 7

  verify:
    # The plugin verifier against both ends of the supported range. There are no unit tests here —
    # a headless IDE test costs more harness than this plugin has code — so this job is the
    # automated half of the checking, and the README's manual checklist is the other.
    #
    # It downloads an IDE per verified version, which is why it is a job of its own: minutes, and
    # a cache the build job has no use for.
    name: Verify against the supported IDEs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Verify plugin
        run: ./gradlew verifyPlugin

  grammar-sync:
    # The TextMate grammar is made by tree-sitter-lyric from its grammar, so that the words and
    # the literal forms have one account; this repository carries the file that script writes,
    # and this job keeps the copy from becoming a fork.
    name: Grammar is tree-sitter-lyric's
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout tree-sitter-lyric
        uses: actions/checkout@v7
        with:
          repository: lyriclang/tree-sitter-lyric
          path: tree-sitter-lyric
          sparse-checkout: textmate

      - name: Compare
        run: diff textmate/syntaxes/lyric.tmLanguage.json tree-sitter-lyric/textmate/lyric.tmLanguage.json
